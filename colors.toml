light_foreground = "#93a1a1"
bright_foreground = "#fdf6e3"

red = "#dc322f"
yellow = "#b58900"
orange = "#cb4b16"
green = "#859900"
cyan = "#2aa198"
blue = "#268bd2"
magenta = "#d33682"
brown = "#7c5c3b"

bright_red = "#cb4b16"
bright_yellow = "#b58900"
